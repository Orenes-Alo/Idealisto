# idealisto.es — landing estática
# Config inicial pre-certbot (solo puerto 80). Certbot añade el bloque SSL
# en el servidor al ejecutar: sudo certbot --nginx -d idealisto.es -d www.idealisto.es
# NO copiar este archivo encima del de sites-available una vez certbot lo haya modificado.

server {
    listen 80;
    listen [::]:80;
    server_name idealisto.es www.idealisto.es;

    root /home/orenes/idealisto/public;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Cache básica para estáticos
    location ~* \.(css|js|png|jpg|jpeg|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
