# idealisto.es — landing estática + waitlist API
# SOLO REFERENCIA: el archivo vivo en el servidor ya fue modificado por certbot
# (bloques SSL). NO copiar este archivo encima de sites-available; editar allí in-place.

server {
    listen 80;
    listen [::]:80;
    server_name idealisto.es www.idealisto.es;

    root /home/orenes/idealisto/public;
    index index.html;

    # Waitlist (screen idealisto-waitlist, bun server/index.ts)
    location /api/ {
        proxy_pass http://127.0.0.1:3201;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Cache básica para estáticos
    location ~* \.(css|js|png|jpg|jpeg|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
