<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Idealisto — Oportunidades de inversión inmobiliaria</title>
  <meta name="description" content="Idealisto: el marketplace de oportunidades de inversión inmobiliaria en España. Publica gratis tu activo verificado. Invierte con los números ya hechos.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c1220;
      --card: #131c30;
      --text: #eef2f9;
      --muted: #93a0b8;
      --accent: #3b82f6;
      --accent-2: #60a5fa;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(59,130,246,.18), transparent);
    }
    main { max-width: 640px; text-align: center; }
    .logo {
      font-size: clamp(2.4rem, 8vw, 3.6rem);
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .logo span { color: var(--accent-2); }
    .tagline {
      margin-top: 1rem;
      font-size: clamp(1.05rem, 3vw, 1.3rem);
      font-weight: 300;
      color: var(--muted);
      line-height: 1.55;
    }
    .pills {
      margin-top: 2.25rem;
      display: flex;
      flex-wrap: wrap;
      gap: .6rem;
      justify-content: center;
    }
    .pill {
      background: var(--card);
      border: 1px solid rgba(147,160,184,.18);
      border-radius: 999px;
      padding: .5rem 1.1rem;
      font-size: .88rem;
      color: var(--muted);
    }
    .soon {
      margin-top: 2.5rem;
      display: inline-block;
      background: rgba(59,130,246,.12);
      border: 1px solid rgba(59,130,246,.35);
      color: var(--accent-2);
      border-radius: 10px;
      padding: .7rem 1.4rem;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
      font-size: .85rem;
    }
    footer {
      margin-top: 3.5rem;
      font-size: .8rem;
      color: var(--muted);
      opacity: .7;
    }
  </style>
</head>
<body>
  <main>
    <h1 class="logo">Ideal<span>isto</span></h1>
    <p class="tagline">El marketplace de oportunidades de inversión inmobiliaria.<br>Activos verificados, con los números ya hechos.</p>
    <div class="pills">
      <span class="pill">Publicar es gratis</span>
      <span class="pill">Titularidad verificada</span>
      <span class="pill">Rentabilidad calculada</span>
      <span class="pill">Toda España</span>
    </div>
    <div class="soon">Próximamente</div>
  </main>
  <footer>© 2026 Idealisto · idealisto.es</footer>
</body>
</html>
